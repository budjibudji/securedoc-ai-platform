apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: default
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # --- C'est ici que ça change ---
      # On utilise host.docker.internal pour dire "Sors de K8s et va sur le Windows de l'hôte"

      - job_name: 'doc-manager-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['host.docker.internal:8081']  # <--- CHANGEMENT ICI
            labels:
              application: 'doc-manager-service'

      - job_name: 'ai-redactor-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['host.docker.internal:8082']  # <--- CHANGEMENT ICI
            labels:
              application: 'ai-redactor-service'

      - job_name: 'audit-service'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['host.docker.internal:8083']  # <--- CHANGEMENT ICI
            labels:
              application: 'audit-service'