# ===============================
# ? Configuration du Serveur
# ===============================
server.port=8081
spring.application.name=doc-manager-service

# ===============================
# Configuration PostgreSQL
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:7000/securedoc_db
spring.datasource.username=admin
spring.datasource.password=password123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# Configuration RabbitMQ
# ===============================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ===============================
# Configuration MinIO (API S3)
# ===============================
minio.url=http://localhost:30090
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket-name=securedoc-files

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/ensam-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/ensam-realm/protocol/openid-connect/certs

# CONFIGURATION MONITORING
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}